# Accel-Sim CI Workflow
#
# This workflow runs on push and pull request events.
# Jobs: check-format, SASS-Simulation, PTX-Simulation, Tracer-Tool

name: CI Runs

on:
  push:
  # Required for cross-repo PRs: a PR from a fork does not fire `push` in this
  # repo, so without this the PR gets no CI at all.
  pull_request:
  workflow_dispatch:

env:
  BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
  PR_HEAD_REPO_FULL_NAME: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
  GITHUB_EVENT_NAME: ${{ github.event_name }}
  GITHUB_REPOSITORY: ${{ github.repository }}
  GITHUB_RUN_NUMBER: ${{ github.run_number }}
  GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
  # run_simulations.py and on-cluster.sh put this in their Slurm jobs' comment;
  # the simulation jobs append :<job> so each can cancel only its own
  ACCELSIM_SLURM_COMMENT: gh-run:${{ github.run_id }}.${{ github.run_attempt }}
  # SASS suites: full (archived, correlated) on dev, smoke elsewhere (main-sass.sh)
  CI_TIER: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref_name == 'dev' && 'full' || 'smoke' }}
  # the <GPU>-<config> dirs of statistics-archive the emails link to
  CORREL_GPUS: "QV100-SASS:V100 H200-SASS:H200"

# A new push cancels its branch's older run, except on the default branch.
# dev: one group per commit, so every dev commit runs and is correlated (a
# shared group would drop all but the newest pending run). Elsewhere: newest wins.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

jobs:
  check-format:
    runs-on: tgrogers-raid
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check for forbidden files
        run: ./.github/scripts/check-forbidden-files.sh

      - name: Check code formatting
        run: |
          /bin/bash ./gpu-simulator/format-code.sh
          /bin/bash ./util/tracer_nvbit/tracer_tool/format-code.sh

          if git diff --quiet; then
            echo "Code is properly formatted"
          else
            echo "Code formatting check failed. The following files need formatting:"
            git diff --name-only
            echo ""
            echo "Please run the formatter locally and commit the changes:"
            echo "/bin/bash ./format-code.sh"
            exit 1
          fi

  SASS-Simulation:
    runs-on: tgrogers-raid
    needs: [check-format]
    timeout-minutes: 720
    env:
      ACCELSIM_SLURM_COMMENT: gh-run:${{ github.run_id }}.${{ github.run_attempt }}:${{ github.job }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6

      - name: Setup Environment
        run: ./.github/scripts/main-sass.sh setup

      - name: Build Accel-Sim
        run: ./.github/scripts/main-sass.sh build 2>&1 | tee build.log

      # Fails when any simulation has no valid output (get_stats --strict)
      - name: Run SASS Simulations
        run: ./.github/scripts/main-sass.sh simulate

      - name: Correlate with Hardware
        if: env.CI_TIER == 'full'
        run: ./.github/scripts/main-sass.sh correlate

      # Only after every step above succeeded, so a failed run is never archived
      - name: Archive Stats
        if: env.CI_TIER == 'full' && github.event_name == 'push'
        run: ./.github/scripts/main-sass.sh archive

      - name: AI analysis of the results
        if: success()
        continue-on-error: true # the analysis never changes the CI result
        env:
          AI: ${{ vars.AALP_CI_DIR || '/scratch/tgrogers-disk01/a/tgrghci/github-ci' }}/ai
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # plot-correlation stdout per config; per-kernel CSVs of the last config
          CI_ANALYSIS_FILES: "ci-stats/*/correl.txt ci-stats/*/*.kernel.raw.csv util/job_launching/logfiles/failed_job_log_*.txt"
        run: $AI/ci-analysis.sh

      # The next job on this runner wipes the workspace the sims run in
      - name: Cancel this job's Slurm jobs
        if: failure() || cancelled()
        run: ./.github/scripts/cancel-slurm.sh

      - name: Collect simulation logs
        if: failure() || cancelled()
        run: ./.github/scripts/collect-sim-logs.sh sim-logs

      - name: Upload simulation logs
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: sim-logs-${{ github.job }}-${{ github.run_attempt }}
          path: sim-logs/
          retention-days: 14
          if-no-files-found: ignore

  PTX-Simulation:
    needs: [check-format]
    runs-on: tgrogers-raid
    timeout-minutes: 720
    env:
      ACCELSIM_SLURM_COMMENT: gh-run:${{ github.run_id }}.${{ github.run_attempt }}:${{ github.job }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6

      - name: Setup Environment
        run: ./.github/scripts/main-ptx.sh setup

      - name: Build Accel-Sim
        run: ./.github/scripts/main-ptx.sh build

      - name: Build Applications
        run: ./.github/scripts/main-ptx.sh build-apps

      - name: Run PTX Simulations
        run: ./.github/scripts/main-ptx.sh simulate

      # The next job on this runner wipes the workspace the sims run in
      - name: Cancel this job's Slurm jobs
        if: failure() || cancelled()
        run: ./.github/scripts/cancel-slurm.sh

      - name: Collect simulation logs
        if: failure() || cancelled()
        run: ./.github/scripts/collect-sim-logs.sh sim-logs

      - name: Upload simulation logs
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: sim-logs-${{ github.job }}-${{ github.run_attempt }}
          path: sim-logs/
          retention-days: 14
          if-no-files-found: ignore

  Tracer-Tool:
    needs: [check-format]
    runs-on: tgrogers-raid
    timeout-minutes: 720
    env:
      ACCELSIM_SLURM_COMMENT: gh-run:${{ github.run_id }}.${{ github.run_attempt }}:${{ github.job }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6

      - name: Setup Environment
        run: ./.github/scripts/main-tracer.sh setup

      - name: Build Accel-Sim
        run: ./.github/scripts/main-tracer.sh build

      - name: Build Tracer
        run: ./.github/scripts/main-tracer.sh build-tracer

      - name: Build Applications
        run: ./.github/scripts/main-tracer.sh build-apps

      - name: Generate Traces
        run: ./.github/scripts/main-tracer.sh trace

      - name: Test Multi-GPU Tracing
        run: ./.github/scripts/main-tracer.sh trace-parallel

      - name: Generate HW Stats
        run: ./.github/scripts/main-tracer.sh hw-stats

      - name: Test New Traces
        run: ./.github/scripts/main-tracer.sh test

      # The next job on this runner wipes the workspace the sims run in
      - name: Cancel this job's Slurm jobs
        if: failure() || cancelled()
        run: ./.github/scripts/cancel-slurm.sh

  SASS-Simulation-Docker:
    # The short QV100 SASS regression built and run in the accel-sim-framework
    # image, under apptainer on a Slurm node (.github/scripts/main-docker.sh)
    needs: [check-format]
    runs-on: tgrogers-raid
    timeout-minutes: 360
    env:
      ACCELSIM_SLURM_COMMENT: gh-run:${{ github.run_id }}.${{ github.run_attempt }}:${{ github.job }}
      IMAGE_TAG: ubuntu-24.04-cuda-12.8-minimal
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6

      - name: Setup Environment
        run: ./.github/scripts/main-docker.sh setup

      - name: Build and Run in the Image
        run: ./.github/scripts/main-docker.sh run

      # The next job on this runner wipes the workspace the sims run in
      - name: Cancel this job's Slurm jobs
        if: failure() || cancelled()
        run: ./.github/scripts/cancel-slurm.sh

      - name: Collect simulation logs
        if: failure() || cancelled()
        run: ./.github/scripts/collect-sim-logs.sh sim-logs

      - name: Upload simulation logs
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: sim-logs-${{ github.job }}-${{ github.run_attempt }}
          path: sim-logs/
          retention-days: 14
          if-no-files-found: ignore

  CI-Success:
    env:
      ACTION_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    runs-on: tgrogers-raid
    needs: [check-format, SASS-Simulation, PTX-Simulation, Tracer-Tool, SASS-Simulation-Docker]
    steps:
      - uses: actions/checkout@v6
      - run: |
          echo "All CI tests completed successfully!"
          echo "check-format: OK"
          echo "SASS-Simulation: OK"
          echo "PTX-Simulation: OK"
          echo "Tracer-Tool: OK"
          echo "SASS-Simulation-Docker: OK"

          # Email only for dev pushes (full suite + correlation); PRs get none
          if [[ ${{ github.event_name }} == 'push' && ${{ github.ref_name }} == 'dev' ]]; then
            git clone --quiet --branch cluster-ubuntu git@github.com:purdue-aalp/env-setup.git
            source ./env-setup/common/common_inc.sh
            export REPORT_URL="https://rawcdn.githack.com/accel-sim/statistics-archive/$GITHUB_REPOSITORY/$BRANCH_NAME/ubench/"
            python3 .github/scripts/send_ci_email.py -t success
          fi

  # PRs get no email; see CI-Success
  failures:
    if: failure() && github.event_name == 'push' && github.ref_name == 'dev'
    env:
      ACTION_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      REPORT_URL: ""
    runs-on: tgrogers-raid
    needs: [check-format, SASS-Simulation, PTX-Simulation, Tracer-Tool, SASS-Simulation-Docker]
    steps:
      - uses: actions/checkout@v6
      - name: Notify Failure
        run: |
          git clone --quiet --branch cluster-ubuntu git@github.com:purdue-aalp/env-setup.git
          source ./env-setup/common/common_inc.sh
          python3 .github/scripts/send_ci_email.py -t failure -u

  # Also on failure or timeout: a monitor that gives up leaves its sims queued
  cleanup-slurm:
    if: always() && needs.check-format.result != 'skipped'
    runs-on: tgrogers-raid
    needs: [check-format, SASS-Simulation, PTX-Simulation, Tracer-Tool, SASS-Simulation-Docker]
    steps:
      - name: Cancel this run's Slurm jobs
        run: |
          jobs=$(squeue -h -u "$(id -un)" -o '%i %k' | awk -v t="$ACCELSIM_SLURM_COMMENT" '$2 == t || index($2, t ":") == 1 {print $1}')
          echo "cancelling: ${jobs:-none}"
          [ -z "$jobs" ] || scancel $jobs
