# Accel-Sim CI Workflow
#
# This workflow runs on push and pull request events.
# Jobs: check-format, SASS-Simulation, PTX-Simulation, Tracer-Tool

name: CI Runs

on:
  push:
  # Required for cross-repo PRs: a PR from a fork does not fire `push` in this
  # repo, so without this the PR gets no CI at all.
  pull_request:
  workflow_dispatch:

env:
  BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
  PR_HEAD_REPO_FULL_NAME: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
  GITHUB_EVENT_NAME: ${{ github.event_name }}
  GITHUB_REPOSITORY: ${{ github.repository }}
  GITHUB_RUN_NUMBER: ${{ github.run_number }}
  GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
  # run_simulations.py and on-cluster.sh put this in their Slurm jobs' comment
  ACCELSIM_SLURM_COMMENT: gh-run:${{ github.run_id }}.${{ github.run_attempt }}

# A new push cancels its branch's older run, except on the default branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

jobs:
  check-format:
    runs-on: tgrogers-raid
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check for forbidden files
        run: ./.github/scripts/check-forbidden-files.sh

      - name: Check code formatting
        run: |
          /bin/bash ./gpu-simulator/format-code.sh
          /bin/bash ./util/tracer_nvbit/tracer_tool/format-code.sh

          if git diff --quiet; then
            echo "Code is properly formatted"
          else
            echo "Code formatting check failed. The following files need formatting:"
            git diff --name-only
            echo ""
            echo "Please run the formatter locally and commit the changes:"
            echo "/bin/bash ./format-code.sh"
            exit 1
          fi

  SASS-Simulation:
    runs-on: tgrogers-raid
    needs: [check-format]
    timeout-minutes: 720
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6

      - name: Setup Environment
        run: ./.github/scripts/main-sass.sh setup

      - name: Build Accel-Sim
        run: ./.github/scripts/main-sass.sh build 2>&1 | tee build.log

      - name: Run SASS Simulations
        run: ./.github/scripts/main-sass.sh simulate

      - name: Archive Stats
        run: ./.github/scripts/main-sass.sh archive

      - name: Correlate Ubench
        run: ./.github/scripts/main-sass.sh correlate

      - name: AI analysis of the results
        if: success()
        continue-on-error: true # the analysis never changes the CI result
        env:
          AI: ${{ vars.AALP_CI_DIR || '/scratch/tgrogers-disk01/a/tgrghci/github-ci' }}/ai
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # plot-correlation stdout per config; per-kernel CSVs of the last config
          CI_ANALYSIS_FILES: "*-ubench-correl.txt util/plotting/correl-html/*.kernel.raw.csv util/job_launching/logfiles/failed_job_log_*.txt"
        run: $AI/ci-analysis.sh

  PTX-Simulation:
    needs: [check-format]
    runs-on: tgrogers-raid
    timeout-minutes: 720
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6

      - name: Setup Environment
        run: ./.github/scripts/main-ptx.sh setup

      - name: Build Accel-Sim
        run: ./.github/scripts/main-ptx.sh build

      - name: Build Applications
        run: ./.github/scripts/main-ptx.sh build-apps

      - name: Run PTX Simulations
        run: ./.github/scripts/main-ptx.sh simulate

  Tracer-Tool:
    needs: [check-format]
    runs-on: tgrogers-raid
    timeout-minutes: 720
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6

      - name: Setup Environment
        run: ./.github/scripts/main-tracer.sh setup

      - name: Build Accel-Sim
        run: ./.github/scripts/main-tracer.sh build

      - name: Build Tracer
        run: ./.github/scripts/main-tracer.sh build-tracer

      - name: Build Applications
        run: ./.github/scripts/main-tracer.sh build-apps

      - name: Generate Traces
        run: ./.github/scripts/main-tracer.sh trace

      - name: Generate HW Stats
        run: ./.github/scripts/main-tracer.sh hw-stats

      - name: Test New Traces
        run: ./.github/scripts/main-tracer.sh test

  SASS-Simulation-Docker:
    # The short QV100 SASS regression built and run in the accel-sim-framework
    # image, under apptainer on a Slurm node (.github/scripts/main-docker.sh)
    needs: [check-format]
    runs-on: tgrogers-raid
    timeout-minutes: 360
    env:
      IMAGE_TAG: ubuntu-24.04-cuda-12.8-minimal
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6

      - name: Setup Environment
        run: ./.github/scripts/main-docker.sh setup

      - name: Build and Run in the Image
        run: ./.github/scripts/main-docker.sh run

  CI-Success:
    env:
      ACTION_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    runs-on: tgrogers-raid
    needs: [check-format, SASS-Simulation, PTX-Simulation, Tracer-Tool, SASS-Simulation-Docker]
    steps:
      - uses: actions/checkout@v6
      - run: |
          echo "All CI tests completed successfully!"
          echo "check-format: OK"
          echo "SASS-Simulation: OK"
          echo "PTX-Simulation: OK"
          echo "Tracer-Tool: OK"
          echo "SASS-Simulation-Docker: OK"

          git clone --quiet --branch cluster-ubuntu git@github.com:purdue-aalp/env-setup.git
          source ./env-setup/common/common_inc.sh
          if [[ ${{ github.event_name }} == 'pull_request' ]]; then
            export REPORT_URL="https://rawcdn.githack.com/accel-sim/statistics-archive/$PR_HEAD_REPO_FULL_NAME/$BRANCH_NAME/ubench/"
            # the prefixes main-sass.sh STAT_PREFIXES writes
            export CORREL_GPUS="v100:V100 ampere-a100:A100 hopper-h200:H200"
            python3 .github/scripts/send_ci_email.py -t success
          fi

  failures:
    if: failure()
    env:
      ACTION_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      REPORT_URL: ""
    runs-on: tgrogers-raid
    needs: [check-format, SASS-Simulation, PTX-Simulation, Tracer-Tool, SASS-Simulation-Docker]
    steps:
      - uses: actions/checkout@v6
      - name: Notify Failure
        run: |
          git clone --quiet --branch cluster-ubuntu git@github.com:purdue-aalp/env-setup.git
          source ./env-setup/common/common_inc.sh
          if [[ ${{ github.event_name }} == 'pull_request' ]]; then
            python3 .github/scripts/send_ci_email.py -t failure
          elif [[ ${{ github.event_name }} == 'push' && ${{ github.ref_name }} == 'dev' ]]; then
            python3 .github/scripts/send_ci_email.py -t failure -u
          fi

  # Also on failure or timeout: a monitor that gives up leaves its sims queued
  cleanup-slurm:
    if: always()
    runs-on: tgrogers-raid
    needs: [SASS-Simulation, PTX-Simulation, Tracer-Tool, SASS-Simulation-Docker]
    steps:
      - name: Cancel this run's Slurm jobs
        run: |
          jobs=$(squeue -h -u "$(id -un)" -o '%i %k' | awk -v t="$ACCELSIM_SLURM_COMMENT" '$2 == t {print $1}')
          echo "cancelling: ${jobs:-none}"
          [ -z "$jobs" ] || scancel $jobs
