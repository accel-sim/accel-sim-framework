name: Hopper Weekly

on:
  workflow_dispatch:
    inputs:
      skip_tracer:
        description: 'Skip tracer step (use existing traces)'
        required: false
        type: boolean
        default: false
  schedule:
    - cron: '0 19 * * FRI'  # 7:00 PM every Friday

env:
  BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
  GITHUB_REPOSITORY: ${{ github.repository }}
  GITHUB_RUN_NUMBER: ${{ github.run_number }}
  GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}

jobs:
  Tracer-Hopper:
    if: ${{ !inputs.skip_tracer }}
    runs-on: tgrogers-raid
    timeout-minutes: 720
    concurrency:
      group: sk-h200-remote
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6

      - name: Connect to VPN
        run: ./.github/scripts/hopper-weekly.sh tracer-vpn-connect

      - name: Clean remote directory
        run: ./.github/scripts/hopper-weekly.sh tracer-clean-remote

      - name: Sync repository to remote
        run: ./.github/scripts/hopper-weekly.sh tracer-sync-push

      - name: Generate traces on H200
        run: ./.github/scripts/hopper-weekly.sh tracer-run

      - name: Sync traces back from remote
        run: ./.github/scripts/hopper-weekly.sh tracer-sync-pull

      - name: Cleanup VPN
        if: always()
        run: ./.github/scripts/hopper-weekly.sh tracer-vpn-cleanup

  SASS-Hopper:
    timeout-minutes: 720
    needs: [Tracer-Hopper]
    if: ${{ !cancelled() && (needs.Tracer-Hopper.result == 'success' || needs.Tracer-Hopper.result == 'skipped') }}
    runs-on: tgrogers-raid
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6

      - name: Setup Environment
        run: ./.github/scripts/hopper-weekly.sh sass-setup

      - name: Build Accel-Sim
        run: ./.github/scripts/hopper-weekly.sh sass-build 2>&1 | tee build.log

      - name: Run SASS Simulation
        run: ./.github/scripts/hopper-weekly.sh sass-simulate

      - name: Archive Stats
        if: always()
        run: ./.github/scripts/hopper-weekly.sh sass-archive

      - name: Correlate Ubench
        if: always()
        run: ./.github/scripts/hopper-weekly.sh sass-correlate

      - name: Analyze success with opencode
        if: success()
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_WORKSPACE: ${{ github.workspace }}
        run: |
          rm -f ci-analysis-report.md
          opencode run \
            --dir "$GITHUB_WORKSPACE" \
            --model local-llamacpp/Qwen3.5-27B-Q8_0.gguf \
            "Follow the procedure in .github/skills/ci-analysis.md to analyze this successful CI run. Write your final report to ci-analysis-report.md as instructed." \
            || true
          if [ -s ci-analysis-report.md ]; then
            cat ci-analysis-report.md >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## AI Simulation Analysis"
              echo
              echo "opencode did not produce \`ci-analysis-report.md\`. See the step log for details."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Analyze failure with opencode
        if: failure()
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_WORKSPACE: ${{ github.workspace }}
        run: |
          rm -f ci-failure-report.md
          opencode run \
            --dir "$GITHUB_WORKSPACE" \
            --model local-llamacpp/Qwen3.5-27B-Q8_0.gguf \
            "Follow the procedure in .github/skills/ci-failure.md to analyze this failed CI run. Write your final report to ci-failure-report.md as instructed." \
            || true
          if [ -s ci-failure-report.md ]; then
            cat ci-failure-report.md >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## AI Failure Analysis"
              echo
              echo "opencode did not produce \`ci-failure-report.md\`. See the step log for details."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  failures:
    if: failure()
    env:
      ACTION_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      REPORT_URL: ""
    runs-on: tgrogers-raid
    needs: [Tracer-Hopper, SASS-Hopper]
    steps:
      - uses: actions/checkout@v6
      - name: Notify Failure
        run: |
          git clone --quiet --branch cluster-ubuntu git@github.com:purdue-aalp/env-setup.git
          source ./env-setup/common/common_inc.sh
          export BRANCH_NAME="Hopper Weekly"
          python3 .github/scripts/send_ci_email.py -t failure

  success:
    if: ${{ !cancelled() && !failure() }}
    env:
      ACTION_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      REPORT_URL: "https://rawcdn.githack.com/accel-sim/statistics-archive/hopper-weekly/${{ github.head_ref || github.ref_name }}/ubench/"
    runs-on: tgrogers-raid
    needs: [Tracer-Hopper, SASS-Hopper]
    steps:
      - uses: actions/checkout@v6
      - name: Notify Success
        run: |
          git clone --quiet --branch cluster-ubuntu git@github.com:purdue-aalp/env-setup.git
          source ./env-setup/common/common_inc.sh
          export BRANCH_NAME="Hopper Weekly"
          python3 .github/scripts/send_ci_email.py -t success
