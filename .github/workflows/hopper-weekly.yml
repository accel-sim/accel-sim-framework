name: Hopper Weekly

on:
  workflow_dispatch:
    inputs:
      skip_tracer:
        description: 'Skip tracer step (use existing traces)'
        required: false
        type: boolean
        default: false
  schedule:
    - cron: '0 19 * * FRI'  # 7:00 PM every Friday

env:
  BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
  GITHUB_REPOSITORY: ${{ github.repository }}
  GITHUB_RUN_NUMBER: ${{ github.run_number }}
  GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
  # run_simulations.py puts this in its Slurm jobs' comment, for cleanup-slurm
  ACCELSIM_SLURM_COMMENT: gh-run:${{ github.run_id }}.${{ github.run_attempt }}

jobs:
  Tracer-Hopper:
    if: ${{ !inputs.skip_tracer }}
    runs-on: tgrogers-raid
    timeout-minutes: 1440 # +720: waiting for the hopper-weekly lock
    concurrency:
      group: sk-h200-remote
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6

      # One run at a time across the accel-sim and purdue-aalp repos, held for
      # the whole run (the sims read the trace depot); cleanup-slurm releases it
      - name: Wait for the hopper-weekly lock
        run: ./.github/scripts/slurm-lock.sh hopper-weekly-lock 26:00:00

      - name: Connect to VPN
        run: ./.github/scripts/hopper-weekly.sh tracer-vpn-connect

      - name: Clean remote directory
        run: ./.github/scripts/hopper-weekly.sh tracer-clean-remote

      - name: Sync repository to remote
        run: ./.github/scripts/hopper-weekly.sh tracer-sync-push

      - name: Generate traces on H200
        run: ./.github/scripts/hopper-weekly.sh tracer-run

      - name: Sync traces back from remote
        run: ./.github/scripts/hopper-weekly.sh tracer-sync-pull

      - name: Cleanup VPN
        if: always()
        run: ./.github/scripts/hopper-weekly.sh tracer-vpn-cleanup

  SASS-Hopper:
    timeout-minutes: 1440 # +720: waiting for the hopper-weekly lock
    needs: [Tracer-Hopper]
    if: ${{ !cancelled() && (needs.Tracer-Hopper.result == 'success' || needs.Tracer-Hopper.result == 'skipped') }}
    runs-on: tgrogers-raid
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6

      # One run at a time across the accel-sim and purdue-aalp repos, held for
      # the whole run (the sims read the trace depot); cleanup-slurm releases it
      - name: Wait for the hopper-weekly lock
        run: ./.github/scripts/slurm-lock.sh hopper-weekly-lock 26:00:00

      - name: Setup Environment
        run: ./.github/scripts/hopper-weekly.sh sass-setup

      - name: Build Accel-Sim
        run: ./.github/scripts/hopper-weekly.sh sass-build 2>&1 | tee build.log

      - name: Run SASS Simulation
        run: ./.github/scripts/hopper-weekly.sh sass-simulate

      - name: Archive Stats
        if: ${{ !cancelled() }}
        run: ./.github/scripts/hopper-weekly.sh sass-archive

      - name: Correlate Ubench
        if: ${{ !cancelled() }}
        run: ./.github/scripts/hopper-weekly.sh sass-correlate

      - name: AI analysis of the results
        if: success()
        continue-on-error: true # the analysis never changes the CI result
        env:
          AI: ${{ vars.AALP_CI_DIR || '/scratch/tgrogers-disk01/a/tgrghci/github-ci' }}/ai
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # plot-correlation stdout per config; per-kernel CSVs of the last config
          CI_ANALYSIS_FILES: "*-ubench-correl.txt util/plotting/correl-html/*.kernel.raw.csv util/job_launching/logfiles/failed_job_log_*.txt"
        run: $AI/ci-analysis.sh

  failures:
    if: failure()
    env:
      ACTION_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      REPORT_URL: ""
    runs-on: tgrogers-raid
    needs: [Tracer-Hopper, SASS-Hopper]
    steps:
      - uses: actions/checkout@v6
      - name: Notify Failure
        run: |
          git clone --quiet --branch cluster-ubuntu git@github.com:purdue-aalp/env-setup.git
          source ./env-setup/common/common_inc.sh
          export BRANCH_NAME="Hopper Weekly"
          python3 .github/scripts/send_ci_email.py -t failure

  success:
    if: ${{ !cancelled() && !failure() }}
    env:
      ACTION_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      REPORT_URL: "https://rawcdn.githack.com/accel-sim/statistics-archive/hopper-weekly/${{ github.head_ref || github.ref_name }}/ubench/"
    runs-on: tgrogers-raid
    needs: [Tracer-Hopper, SASS-Hopper]
    steps:
      - uses: actions/checkout@v6
      - name: Notify Success
        run: |
          git clone --quiet --branch cluster-ubuntu git@github.com:purdue-aalp/env-setup.git
          source ./env-setup/common/common_inc.sh
          export BRANCH_NAME="Hopper Weekly"
          python3 .github/scripts/send_ci_email.py -t success

  # Also on failure or timeout: a monitor that gives up leaves its sims queued
  cleanup-slurm:
    if: always()
    runs-on: tgrogers-raid
    needs: [Tracer-Hopper, SASS-Hopper]
    steps:
      - name: Cancel this run's Slurm jobs
        run: |
          jobs=$(squeue -h -u "$(id -un)" -o '%i %k' | awk -v t="$ACCELSIM_SLURM_COMMENT" '$2 == t {print $1}')
          echo "cancelling: ${jobs:-none}"
          [ -z "$jobs" ] || scancel $jobs
