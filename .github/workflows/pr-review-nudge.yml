# Pings reviewers of PRs idle in awaiting-human-review. The logic lives in
# purdue-aalp/github-ci ai/nudge.sh on the runner host.
name: PR Review Nudge

on:
  schedule:
    - cron: "0 14 * * 1,4" # Mon + Thu 14:00 UTC
  workflow_dispatch:
    inputs:
      stale_days:
        description: "Days of inactivity before nudging"
        required: false
        default: "3"

permissions:
  pull-requests: write
  issues: write

jobs:
  nudge:
    runs-on: tgrogers-raid
    env:
      AI: ${{ vars.AALP_CI_DIR || '/scratch/tgrogers-disk01/a/tgrghci/github-ci' }}/ai
      REPO: ${{ github.repository }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      STALE_DAYS: ${{ inputs.stale_days || '3' }}
    steps:
      - run: $AI/nudge.sh
