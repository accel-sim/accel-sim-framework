# AI first response to a new issue: an answer for a question, a triage note
# for a bug. The logic lives in purdue-aalp/github-ci ai/issue-triage.sh on the
# runner host; this stub only passes the issue and the per-repo settings.
name: Issue AI Triage

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue number to re-triage"
        required: true
        type: number

permissions:
  contents: read
  issues: write

concurrency:
  group: issue-triage-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: true

jobs:
  triage:
    runs-on: tgrogers-raid
    env:
      AI: ${{ vars.AALP_CI_DIR || '/scratch/tgrogers-disk01/a/tgrghci/github-ci' }}/ai
      REPO: ${{ github.repository }}
      ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Per-repo settings: the source trees searched ("NAME PATH" per line),
      # the labels the reply may apply (ai-triage and possible-duplicate are
      # always added), and the release eras of past issues.
      TRIAGE_TREES: |
        accel-sim .
        gpgpu-sim gpu-simulator/gpgpu-sim
      TRIAGE_LABELS: bug,build,question,tracer,simulator,correlation,config,docs,needs-repro,good-first-issue
      ISSUE_RAG_ERAS: "1.x 2.x@2026-08-25T17:37:42Z"
      ISSUE_RAG_EMBED_URL: ${{ vars.ISSUE_RAG_EMBED_URL }}
      ISSUE_RAG_SHORTCUT: ${{ vars.ISSUE_RAG_SHORTCUT }}
    steps:
      # the default branch: what the reporter runs, and .github/triage-notes.md
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          clean: true
      # gpgpu-sim is not a submodule; most issues are about it. A failed clone
      # is said in the reply.
      - env:
          BRANCH_NAME: ${{ github.event.repository.default_branch }}
        run: |
          ./.github/scripts/clone-gpgpusim.sh -d ./gpu-simulator/gpgpu-sim -f dev ||
            echo "::warning::gpgpu-sim clone failed; triage runs against the framework tree only"
      - run: $AI/issue-triage.sh
      - if: failure()
        run: $AI/issue-triage.sh --notify-failure
