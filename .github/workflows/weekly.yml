name: Weekly

# This week's H200 and V100 traces and hardware stats, plus the hosted H200 ML
# traces, simulated, correlated and archived. Each SASS job's steps run only
# after the previous ones succeed.

on:
  workflow_dispatch:
    inputs:
      skip_tracer:
        description: 'Skip the tracers (use the last traces)'
        required: false
        type: boolean
        default: false
  schedule:
    - cron: '0 19 * * FRI'  # 7:00 PM every Friday

# The trace depots are per repo: one weekly of a repo at a time, never cancelled
concurrency:
  group: weekly-${{ github.repository }}
  cancel-in-progress: false

env:
  BRANCH_NAME: ${{ github.ref_name }}
  # run_simulations.py and the tracer sruns put this in their Slurm jobs' comment
  ACCELSIM_SLURM_COMMENT: gh-run:${{ github.run_id }}.${{ github.run_attempt }}

jobs:
  Tracer-H200:
    if: ${{ !inputs.skip_tracer }}
    runs-on: tgrogers-raid
    timeout-minutes: 1440 # 720 for the tracer, 720 for another repo's to finish
    steps:
      - uses: actions/checkout@v6

      # VPN, sync, trace on the remote H200 and sync back, as one Slurm job.
      # The singleton name is the lock: one tracer uses the remote, VPN and
      # SOCKS port at a time, across repos.
      - name: Generate H200 traces and hardware stats
        env:
          VPN_HOST: ${{ secrets.VPN_HOST }}
          VPN_CERT: ${{ secrets.VPN_CERT }}
          REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
        run: |
          srun -p tgrogers-dgx -J hopper-weekly-tracer --dependency=singleton \
            --time=12:00:00 -c 4 --comment="$ACCELSIM_SLURM_COMMENT" \
            ./.github/scripts/weekly.sh trace-h200

  Tracer-V100:
    if: ${{ !inputs.skip_tracer }}
    runs-on: tgrogers-raid
    timeout-minutes: 1440
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6

      - name: Setup Environment
        run: ./.github/scripts/weekly.sh setup

      - name: Build Tracer and Applications
        run: ./.github/scripts/weekly.sh build-tracer-v100

      # The GPU work goes to gpu01 through the gpu-lock Slurm singleton, which
      # PR Tracer-Tool runs share; each srun holds it only for its own step
      - name: Generate V100 traces
        run: |
          srun -p tgrogers-dgx -J gpu-lock --dependency=singleton --time=08:00:00 \
            --comment="$ACCELSIM_SLURM_COMMENT" ./.github/scripts/weekly.sh trace-v100

      - name: Generate V100 hardware stats
        run: |
          srun -p tgrogers-dgx -J gpu-lock --dependency=singleton --time=08:00:00 \
            --comment="$ACCELSIM_SLURM_COMMENT" ./.github/scripts/weekly.sh hw-stats-v100

      - name: Publish V100 traces
        run: ./.github/scripts/weekly.sh publish-v100

  SASS-H200:
    needs: [Tracer-H200]
    if: ${{ !cancelled() && (needs.Tracer-H200.result == 'success' || needs.Tracer-H200.result == 'skipped') }}
    runs-on: tgrogers-raid
    timeout-minutes: 960
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6

      - name: Setup Environment
        run: ./.github/scripts/weekly.sh setup

      - name: Build Accel-Sim
        run: ./.github/scripts/weekly.sh build 2>&1 | tee build.log

      # Fails when any simulation has no valid output (get_stats --strict)
      - name: Run SASS Simulations
        run: ./.github/scripts/weekly.sh simulate h200

      - name: Correlate with Hardware
        run: ./.github/scripts/weekly.sh correlate h200

      - name: Archive Stats
        run: ./.github/scripts/weekly.sh archive h200

      - name: AI analysis of the results
        if: success()
        continue-on-error: true # the analysis never changes the CI result
        env:
          AI: ${{ vars.AALP_CI_DIR || '/scratch/tgrogers-disk01/a/tgrghci/github-ci' }}/ai
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI_ANALYSIS_FILES: "ci-stats/*/correl.txt ci-stats/*/*.kernel.raw.csv util/job_launching/logfiles/failed_job_log_*.txt"
        run: $AI/ci-analysis.sh

  SASS-V100:
    needs: [Tracer-V100]
    if: ${{ !cancelled() && (needs.Tracer-V100.result == 'success' || needs.Tracer-V100.result == 'skipped') }}
    runs-on: tgrogers-raid
    timeout-minutes: 960
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6

      - name: Setup Environment
        run: ./.github/scripts/weekly.sh setup

      - name: Build Accel-Sim
        run: ./.github/scripts/weekly.sh build 2>&1 | tee build.log

      # Fails when any simulation has no valid output (get_stats --strict)
      - name: Run SASS Simulations
        run: ./.github/scripts/weekly.sh simulate v100

      - name: Correlate with Hardware
        run: ./.github/scripts/weekly.sh correlate v100

      # Same archive branch as SASS-H200; a push that loses the race retries
      - name: Archive Stats
        run: ./.github/scripts/weekly.sh archive v100

      - name: AI analysis of the results
        if: success()
        continue-on-error: true # the analysis never changes the CI result
        env:
          AI: ${{ vars.AALP_CI_DIR || '/scratch/tgrogers-disk01/a/tgrghci/github-ci' }}/ai
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI_ANALYSIS_FILES: "ci-stats/*/correl.txt ci-stats/*/*.kernel.raw.csv util/job_launching/logfiles/failed_job_log_*.txt"
        run: $AI/ci-analysis.sh

  # The hosted ML traces of H200_ml_traces (never traced here), one Slurm array
  # task per kernel; independent of the tracers
  SASS-H200-ML:
    runs-on: tgrogers-raid
    timeout-minutes: 2880
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6

      - name: Setup Environment
        run: ./.github/scripts/weekly.sh setup

      - name: Build Accel-Sim
        run: ./.github/scripts/weekly.sh build 2>&1 | tee build.log

      # Fails when any simulation has no valid output (get_stats --strict)
      - name: Run SASS Simulations
        run: ./.github/scripts/weekly.sh simulate h200-ml

      - name: Correlate with Hardware
        run: ./.github/scripts/weekly.sh correlate h200-ml

      - name: Archive Stats
        run: ./.github/scripts/weekly.sh archive h200-ml

      - name: AI analysis of the results
        if: success()
        continue-on-error: true # the analysis never changes the CI result
        env:
          AI: ${{ vars.AALP_CI_DIR || '/scratch/tgrogers-disk01/a/tgrghci/github-ci' }}/ai
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI_ANALYSIS_FILES: "ci-stats/*/correl.txt ci-stats/*/*.kernel.raw.csv util/job_launching/logfiles/failed_job_log_*.txt"
        run: $AI/ci-analysis.sh

  failures:
    if: failure()
    env:
      ACTION_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      REPORT_URL: ""
    runs-on: tgrogers-raid
    needs: [Tracer-H200, Tracer-V100, SASS-H200, SASS-V100, SASS-H200-ML]
    steps:
      - uses: actions/checkout@v6
      - name: Notify Failure
        run: |
          git clone --quiet --branch cluster-ubuntu git@github.com:purdue-aalp/env-setup.git
          source ./env-setup/common/common_inc.sh
          export BRANCH_NAME="Weekly"
          python3 .github/scripts/send_ci_email.py -t failure

  success:
    if: ${{ !cancelled() && !failure() }}
    env:
      ACTION_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      # the archive branch weekly.sh pushes: weekly/<repo>/<branch>/<group>/<config>
      REPORT_URL: "https://rawcdn.githack.com/accel-sim/statistics-archive/weekly/${{ github.repository }}/${{ github.ref_name }}/"
      CORREL_GPUS: "ubench/H200-SASS:H200 ubench/QV100-SASS:V100 ml/H200-SASS:H200-ML"
    runs-on: tgrogers-raid
    needs: [Tracer-H200, Tracer-V100, SASS-H200, SASS-V100, SASS-H200-ML]
    steps:
      - uses: actions/checkout@v6
      - name: Notify Success
        run: |
          git clone --quiet --branch cluster-ubuntu git@github.com:purdue-aalp/env-setup.git
          source ./env-setup/common/common_inc.sh
          export BRANCH_NAME="Weekly"
          python3 .github/scripts/send_ci_email.py -t success

  # Also on failure or timeout: a monitor that gives up leaves its sims queued
  cleanup-slurm:
    if: always()
    runs-on: tgrogers-raid
    needs: [Tracer-H200, Tracer-V100, SASS-H200, SASS-V100, SASS-H200-ML]
    steps:
      - name: Cancel this run's Slurm jobs
        run: |
          jobs=$(squeue -h -u "$(id -un)" -o '%i %k' | awk -v t="$ACCELSIM_SLURM_COMMENT" '$2 == t {print $1}')
          echo "cancelling: ${jobs:-none}"
          [ -z "$jobs" ] || scancel $jobs
