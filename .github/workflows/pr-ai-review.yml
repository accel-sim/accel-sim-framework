# AI preliminary review on the `ready` label. The logic lives in
# purdue-aalp/github-ci ai/pr-review.sh on the runner host; this stub only
# passes the PR and the per-repo settings.
name: PR AI Preliminary Review

on:
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to re-review"
        required: true
        type: number

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: pr-ai-review-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  ai-review:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.label.name == 'ready')
    runs-on: tgrogers-raid
    env:
      AI: ${{ vars.AALP_CI_DIR || '/scratch/tgrogers-disk01/a/tgrghci/github-ci' }}/ai
      REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Per-repo settings: an extra instruction for the reviewer, and the team
      # requested on PASS (empty: none).
      REVIEW_STANCE: ""
      REQUEST_TEAM: aalp-grad
      APP_ID: ${{ secrets.AALP_APP_ID }}
      APP_PEM: ${{ secrets.AALP_APP_PEM_PATH }}
    steps:
      # the PR's code: the reviewers read around the diff and the tests it adds
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || format('refs/pull/{0}/head', inputs.pr_number) }}
          clean: true
      - run: $AI/pr-review.sh
      - if: failure()
        run: $AI/pr-review.sh --notify-failure
